apiVersion: v1
kind: Pod
metadata:
  name: fail-5-oomkilled-pod
  labels:
    tier: triage-gauntlet
    scenario: oomkilled
spec:
  containers:
    - name: memory-leaker
      image: python:3.11-alpine
      command:
        - "python3"
        - "-c"
        - |
          import time
          print("Allocating memory rapidly...", flush=True)
          chunks = []
          for i in range(10):
              chunks.append(b"x" * (10 * 1024 * 1024))
          print("Allocated 100Mi successfully", flush=True)
          time.sleep(3600)
      resources:
        limits:
          memory: "256Mi"
