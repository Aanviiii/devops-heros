# Fix: backend started before PostgreSQL accepted connections and crashed on `alembic upgrade head`.
services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 3s
      timeout: 3s
      retries: 10
  backend:
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
