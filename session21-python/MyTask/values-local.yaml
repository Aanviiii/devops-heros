# Local minikube values: images built locally and loaded with `minikube image load`
frontend:
  image: taskboard-frontend
  tag: local
backend:
  image: taskboard-backend
  tag: local
appEnv: minikube
logLevel: INFO
ingress:
  enabled: true
  host: taskboard.local
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}
monitoring:
  serviceMonitor:
    enabled: true
